<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고등학교 유전학 퀴즈 게임</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #f0f8ff; 
        }
        #gameCanvas { 
            /* 과학실 바닥 느낌의 색상 */
            background-color: #8fbc8f; 
            border: 3px solid #333; 
            margin-top: 20px; 
            border-radius: 10px;
        }
        .quiz-box { 
            margin-top: 20px; 
            padding: 20px; 
            background: white; 
            display: inline-block; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>
    <h1>🧬 고교 유전학 마스터 🧬</h1>
    <p>방향키로 움직여서 퀴즈를 풀어보세요! (현재는 데모 화면입니다)</p>
    
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    
    <div class="quiz-box" id="quizBox">
        <h3 id="question">Q. 멘델의 유전 법칙 중, 우성 형질만 겉으로 드러나는 법칙은?</h3>
        <button onclick="checkAnswer('우열의 원리')">우열의 원리</button>
        <button onclick="checkAnswer('분리의 법칙')">분리의 법칙</button>
        <button onclick="checkAnswer('독립의 법칙')">독립의 법칙</button>
    </div>

    <script>
        // 게임 화면(캔버스) 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 고등학교 배경 텍스트 그리기
        ctx.fillStyle = 'white';
        ctx.font = '24px 맑은 고딕';
        ctx.fillText('🏫 생명과학실', 250, 50);

        // 플레이어 캐릭터 (일단은 파란색 네모로 표현) 그리기
        ctx.fillStyle = 'blue';
        ctx.fillRect(300, 220, 40, 40); 
        ctx.fillStyle = 'white';
        ctx.font = '12px 맑은 고딕';
        ctx.fillText('나', 315, 245);

        // 정답 확인 함수
        function checkAnswer(answer) {
            if(answer === '우열의 원리') {
                alert('정답입니다! 다음 문제로 이동합니다.');
            } else {
                alert('틀렸습니다. 다시 한 번 생각해 보세요!');
            }
        }
    </script>
</body>
</html>
